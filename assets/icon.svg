<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5b8def;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b5fc7;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Rounded background -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>

  <!-- Windows 11 style controls trio, enlarged and centered.
       All three icons share the same vertical center so the minimize
       reads as a centered dash "-" rather than a bottom-aligned
       underscore "_". -->
  <g filter="url(#shadow)" transform="translate(72, 176)">
    <!-- Minimize: horizontal line, centered (dash) -->
    <g transform="translate(20, 60)">
      <line x1="0" y1="0" x2="80" y2="0" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
    </g>
    <!-- Maximize: square outline -->
    <g transform="translate(160, 20)">
      <rect x="0" y="0" width="80" height="80" rx="6" ry="6"
            stroke="#ffffff" stroke-width="14" fill="none" stroke-linejoin="round"/>
    </g>
    <!-- Close: X -->
    <g transform="translate(300, 20)">
      <line x1="0" y1="0" x2="80" y2="80" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
      <line x1="80" y1="0" x2="0" y2="80" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
    </g>
  </g>
</svg>
