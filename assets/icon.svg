<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5b8def;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b5fc7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="winBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.18" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.08" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Rounded background -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>

  <!-- Soft window outline behind the controls -->
  <g opacity="0.35" stroke="#ffffff" stroke-width="3" fill="none">
    <rect x="72" y="96" width="368" height="320" rx="20" ry="20"/>
    <line x1="72" y1="160" x2="440" y2="160"/>
  </g>

  <!-- Windows 11 style controls trio, enlarged and centered -->
  <g filter="url(#shadow)" transform="translate(96, 192)">
    <!-- Minimize: horizontal line -->
    <g transform="translate(0, 100)">
      <line x1="0" y1="0" x2="80" y2="0" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
    </g>
    <!-- Maximize: square outline -->
    <g transform="translate(120, 20)">
      <rect x="0" y="0" width="80" height="80" rx="6" ry="6"
            stroke="#ffffff" stroke-width="10" fill="none" stroke-linejoin="round"/>
    </g>
    <!-- Close: X -->
    <g transform="translate(240, 20)">
      <line x1="0" y1="0" x2="80" y2="80" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
      <line x1="80" y1="0" x2="0" y2="80" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Small accent dots in corners for polish -->
  <circle cx="48" cy="48" r="6" fill="#ffffff" opacity="0.25"/>
  <circle cx="464" cy="48" r="6" fill="#ffffff" opacity="0.25"/>
  <circle cx="48" cy="464" r="6" fill="#ffffff" opacity="0.25"/>
  <circle cx="464" cy="464" r="6" fill="#ffffff" opacity="0.25"/>
</svg>
